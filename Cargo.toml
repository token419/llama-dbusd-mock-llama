[package]
name = "llama-dbusd-mock-llama"
version = "0.1.1"
edition = "2024"
authors = ["token419"]
description = "Lightweight mock server mimicking llama.cpp server for llama-dbusd testing"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
