name: CI

'on':
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (Gatekeeper)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --verbose

  compile-binaries:
    name: Build (${{ matrix.target }})
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            bin: llama-dbusd-mock-llama
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            bin: llama-dbusd-mock-llama
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            bin: llama-dbusd-mock-llama
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            bin: llama-dbusd-mock-llama
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            bin: llama-dbusd-mock-llama.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cross binary
        if: matrix.use_cross
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross-bin

      - name: Install cross via cargo
        if: matrix.use_cross
        run: |
          if ! command -v cross &> /dev/null; then
            cargo install cross
          fi

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary with cross
        if: matrix.use_cross
        run: cross build --target ${{ matrix.target }} --release

      - name: Build release binary with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --target ${{ matrix.target }} --release

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-dbusd-mock-llama-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release
    needs: compile-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all compiled binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release asset bundles
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          RELEASE_DIR="$PWD/release-assets"
          mkdir -p "$RELEASE_DIR"

          # Package Linux & macOS tar.gz archives
          for TARGET in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            STAGE_DIR="llama-dbusd-mock-llama-$TAG-$TARGET"
            mkdir -p "$STAGE_DIR"

            cp "artifacts/llama-dbusd-mock-llama-$TARGET/llama-dbusd-mock-llama" "$STAGE_DIR/llama-dbusd-mock-llama"
            chmod +x "$STAGE_DIR/llama-dbusd-mock-llama"

            for FILE in README.md LICENSE; do
              if [ -f "$FILE" ]; then
                cp "$FILE" "$STAGE_DIR/$FILE"
              elif [ -f "llama-dbusd-mock-llama/$FILE" ]; then
                cp "llama-dbusd-mock-llama/$FILE" "$STAGE_DIR/$FILE"
              fi
            done

            ARCHIVE_NAME="llama-dbusd-mock-llama-$TAG-$TARGET.tar.gz"
            tar -czvf "$RELEASE_DIR/$ARCHIVE_NAME" -C "$STAGE_DIR" .
          done

          # Package Windows zip archive
          for TARGET in x86_64-pc-windows-msvc; do
            STAGE_DIR="llama-dbusd-mock-llama-$TAG-$TARGET"
            mkdir -p "$STAGE_DIR"

            cp "artifacts/llama-dbusd-mock-llama-$TARGET/llama-dbusd-mock-llama.exe" "$STAGE_DIR/llama-dbusd-mock-llama.exe"

            for FILE in README.md LICENSE; do
              if [ -f "$FILE" ]; then
                cp "$FILE" "$STAGE_DIR/$FILE"
              elif [ -f "llama-dbusd-mock-llama/$FILE" ]; then
                cp "llama-dbusd-mock-llama/$FILE" "$STAGE_DIR/$FILE"
              fi
            done

            ARCHIVE_NAME="llama-dbusd-mock-llama-$TAG-$TARGET.zip"
            (cd "$STAGE_DIR" && zip -r "$RELEASE_DIR/$ARCHIVE_NAME" .)
          done

          cd "$RELEASE_DIR"
          sha256sum llama-dbusd-mock-llama-* > SHA256SUMS.txt
          ls -lh
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
